
<!doctype html>
<html lang="sk">
<head>
  <meta charset="UTF-8" />
  <title>DP Mouse</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
    }

    #dashboard {
      margin-top: 30px;
      padding: 15px;
      width: 900px;
      background: #111827;
      color: white;
      border-radius: 8px;
    }

    #logs div {
      padding: 10px;
      border-bottom: 1px solid #374151;
      font-family: monospace;
      font-size: 13px;
    }
  </style>
</head>

<body>

<script>
  function triggerJSClick() {
    document.getElementById("btn-click-me").click();
  }

  function triggerEventClick() {
    const element = document.getElementById("btn-click-me");
    const rect = element.getBoundingClientRect();

    const x = rect.left + rect.width / 2;
    const y = rect.top + rect.height / 2;

    element.dispatchEvent(new MouseEvent("click", {
      bubbles: true,
      cancelable: true,
      view: window,
      clientX: x,
      clientY: y,
      button: 0,
      buttons: 1
    }));
  }

</script>

<h1>Toto je mouse stranka</h1>

<button id="btn-click-me" style="width: 200px; height: 50px;">
  Klikna ma
</button>

<button id="btn-js-click" style="width: 200px; height: 50px;" onClick="triggerJSClick()">
  Button na JS trigger kliku
</button>

<button id="btn-event-click" style="width: 200px; height: 50px;" onClick="triggerEventClick()">
  Button na trigger click eventu
</button>

<div id="dashboard">
  <h2>Click Dashboard</h2>
  <div id="logs"></div>
</div>

<div id="mouse-logs">
  <h2>Log counter: 0</h2>
</div>

<script src="scripts/mouse_analyze.js"></script>

</body>
</html>
