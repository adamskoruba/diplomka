name: diplomka-stage

services:
  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile.stage:/etc/caddy/Caddyfile:ro
      - ./cloudflare-origin.crt:/etc/caddy/cloudflare-origin.crt:ro
      - ./cloudflare-origin.key:/etc/caddy/cloudflare-origin.key:ro

  backend:
    build:
      context: .
      dockerfile: Dockerfile.stage
    command: >
      gunicorn cfwebsite.wsgi:application
      --bind 0.0.0.0:8000
      --workers 4